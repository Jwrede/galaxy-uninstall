[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxy-uninstall"
version = "0.1.0"
description = "Remove installed Ansible collections, with dependency checks (the missing 'ansible-galaxy collection uninstall')"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Jonathan Wrede" }]
classifiers = [
  "Environment :: Console",
  "Framework :: Ansible",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/Jwrede/galaxy-uninstall"

[project.scripts]
galaxy-uninstall = "galaxy_uninstall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
