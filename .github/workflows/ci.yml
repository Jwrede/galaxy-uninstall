name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            ansible: "ansible-core>=2.15,<2.16"
          - python: "3.11"
            ansible: "ansible-core>=2.17,<2.18"
          - python: "3.13"
            ansible: "ansible-core"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest "${{ matrix.ansible }}" -e .
      - run: ansible --version
      - run: pytest -v
      - name: Installed command runs
        run: galaxy-uninstall --list
